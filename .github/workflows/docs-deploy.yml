name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout docs
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: 🔑 Checkout cocos2d-mono
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: Cocos2D-Mono/cocos2d-mono
          token: ${{ secrets.DOCS_REPO_PAT }}
          path: cocos2d-mono

      # Use the engine repo's own global.json so the SDK always matches what it
      # pins (9.0.305+). A hardcoded version drifts and silently breaks the build.
      - name: ⚙️ Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: cocos2d-mono/global.json

      - name: 🧰 Install DocFX
        run: dotnet tool install -g docfx

      # DocFX only needs the desktop (base TFM) build of the library, and this runner
      # installs no mobile workloads, so the multi-targeted project has to be narrowed
      # to a single TFM for BOTH restore and build. The engine exposes that dial as
      # $(Cocos2DTargetFrameworks) (repo-root Directory.Build.props); overriding
      # TargetFrameworks directly is NOT equivalent, because every per-TFM condition in
      # the csproj compares against $(Cocos2DBaseTfm)/$(Cocos2DWindowsTfm)/... - an
      # unknown value such as net9.0 matches none of them, so no MonoGame.Framework.*
      # package is referenced and the build dies with "The MonoGamePlatform property was
      # not defined in the project!". The base TFM is read from the engine checkout so a
      # .NET bump there (net9.0 -> net10.0 in 2.6.0) carries over without an edit here.
      - name: 🎯 Resolve engine base TFM
        run: |
          cd cocos2d-mono
          $tfm = (dotnet msbuild src/Cocos2DMono/Cocos2DMono.csproj -getProperty:Cocos2DBaseTfm).Trim()
          if (-not $tfm) { throw "Could not resolve Cocos2DBaseTfm from the cocos2d-mono checkout" }
          Write-Host "Engine base TFM: $tfm"
          "COCOS2D_BASE_TFM=$tfm" | Out-File -FilePath $env:GITHUB_ENV -Append
        shell: pwsh

      - name: 📦 Restore API project
        run: |
          cd cocos2d-mono
          dotnet restore src/Cocos2DMono/Cocos2DMono.csproj -p:Cocos2DTargetFrameworks=$env:COCOS2D_BASE_TFM

      - name: 📖 Build API project
        run: |
          cd cocos2d-mono
          dotnet build src/Cocos2DMono/Cocos2DMono.csproj -c Release -p:Cocos2DTargetFrameworks=$env:COCOS2D_BASE_TFM --no-restore

      # The engine's docfx.json hardcodes the TFM in the assembly paths it reads, so it
      # lags behind a .NET bump. Point it at whatever TFM was actually just built.
      - name: 📘 Generate DocFX Metadata
        run: |
          cd cocos2d-mono/docfx
          $config = Get-Content docfx.json -Raw
          $config = [regex]::Replace($config, 'net\d+\.\d+', $env:COCOS2D_BASE_TFM)
          Set-Content docfx.json -Value $config
          docfx metadata
        shell: pwsh

      - name: 📝 Copy DocFX output to docs
        run: |
          # Copy the YAML files to the docs directory
          if (Test-Path "cocos2d-mono/docfx/api") {
            if (-not (Test-Path "docs/api")) {
              New-Item -ItemType Directory -Path "docs/api" -Force
            }
            Copy-Item -Path "cocos2d-mono/docfx/api/*" -Destination "docs/api/" -Recurse -Force
          }
        shell: pwsh

      - name: 📦 Install Node.js dependencies
        run: npm install

      - name: 📝 Convert DocFX YAML to MDX
        run: |
          # Process YAML files to MDX for Docusaurus compatibility
          node scripts/process-docfx-output.js
        shell: pwsh

      - name: 📦 Create zip archive of docfx YAML
        run: |
          powershell -Command "Compress-Archive -Path docs/api/* -DestinationPath docfx-yaml.zip"

      - name: 📤 Upload docfx YAML as artifact
        uses: actions/upload-artifact@v4
        with:
          name: docfx-yaml
          path: docfx-yaml.zip

      - name: 📚 Build Docusaurus
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Copy CNAME
        run: cp ./CNAME ./build/CNAME

      - name: 🚀 Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token:
            ${{ secrets.GITHUB_TOKEN }}
            # Build output to publish to the `gh-pages` branch:
          publish_dir: ./build
          cname:
            cocos2d-mono.dev
            # The following lines assign commit authorship to the official
            # GH-Actions bot for deploys to `gh-pages` branch:
            # https://github.com/actions/checkout/issues/13#issuecomment-724415212
            # The GH actions bot is used by default if you didn't specify the two fields.
            # You can swap them out with your own user credentials.
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
